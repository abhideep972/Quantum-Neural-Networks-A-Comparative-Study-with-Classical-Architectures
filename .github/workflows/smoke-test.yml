name: smoke-test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: MPLBACKEND=Agg python reproduction/effective_dimension/plot_fig/ed_plot.py
      - run: MPLBACKEND=Agg python reproduction/fisher_spectrum/plot_fig/dist_plot.py
      - run: MPLBACKEND=Agg python reproduction/trainability/plot_fig/loss_plot.py
